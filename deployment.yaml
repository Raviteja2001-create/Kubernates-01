apiVersion: apps/v1
kind: Deployment
  
metadata:
  name: nginx
  labels:
    project: roboshop
    tier: frontend
    component: frontend
spec:
  replicas: 3
  selector:
   matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
  template:
   metadata:
     labels:
       project: roboshop
       tier: frontend
       component: frontend
   spec:
     containers:
      - name: nginx
        image: nginx:latest
        ports:
         - containerPort: 80

---
apiVersion: v1  
kind: Service
metadata:
  name: nginx
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    
spec:
  selector:
    
      project: roboshop
      tier: frontend
      component: frontend
      
  ports:
      - protocol: TCP
        port: 80
        targetPort: 80

          

