apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs2-static
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 1Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-0cc377f9c952c7679
  
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: example2-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
---
apiVersion: v1
kind: Pod
metadata:
  name: pv-pod
spec:
  containers:
    - name: app-container
      image: nginx:latest
      volumeMounts:
        - mountPath: "/usr/share/nginx/html"
          name: ebs2-static
  volumes:
    - name: ebs2-static
      persistentVolumeClaim:
        claimName: example2-pvc