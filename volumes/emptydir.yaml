apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  containers:
    - image: nginx
      name: nginx
      volumeMounts:
       - mountPath: /var/log/nginx
         name: cache-volume
    - image: almalinux:9
      name: almalinux
      command: ["sleep" , "3000"]     
      volumeMounts:
        - mountPath: /red/nginx-logs
          name: cache-volume
          readOnly: true
  volumes:
  - name: cache-volume
    # this creates intially empty directory in the node where pod scheduled
    emptyDir:
      sizeLimit: 500Mi

           


  
        