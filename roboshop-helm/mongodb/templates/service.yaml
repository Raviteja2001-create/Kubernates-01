apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  # servicer labels
  labels:
    name: mongodb
    project: roboshop
    tier: database
    environment: production
spec:
  # Service uses the below labels to select the pods
  selector:
  
    name: mongodb
    project: roboshop
    tier: database
    environment: production
  ports:
    - protocol: TCP
      port: 27017 # service port
      targetPort: 27017 # container port         

       