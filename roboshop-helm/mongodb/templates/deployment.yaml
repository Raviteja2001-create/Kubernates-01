apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    name: mongodb
    project: roboshop
    tier: database
    environment: production
spec:
  replicas: {{ .Values.Deployment.replicas }}
  selector: 
   matchLabels:  
     name: mongodb
     project: roboshop
     tier: database
     environment: production
  template:
   metadata:
     labels:
       name: mongodb
       project: roboshop
       tier: database
       environment: production
   spec:
     containers:
      - name: mongodb
        image: "{{.Values.Deployment.image }}"
        ports:
         - containerPort: 27017