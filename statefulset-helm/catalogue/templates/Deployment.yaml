---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  # labels related to deployment resource
  labels:
    project: roboshop
    tier: backend
    component: catalogue
spec:
  replicas: {{ .Values.Deployment.replicas}}
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: catalogue   
  template:
    metadata:
     labels: 
       project: roboshop
       tier: backend
       component: catalogue   
    spec:
      containers:
       - name: catalogue
         image: {{ .Values.Deployment.image}}
         envFrom:
         - configMapRef:
             name: catalogue-config
           