apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  labels: 
    project: roboshop
    environment: production
    name: redis
    tier: database
spec:
  selector:
    matchLabels:
      name: redis
      project: roboshop
      environment: production
      tier: database
  template:
   metadata:
     labels:
       name: redis
       project: roboshop
       tier: database
       environment: production
   spec:
     containers:
      - name: redis
        image: redis:7
        ports:
         - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  # servicer labels
  labels:
    name: redis
    project: roboshop
    tier: database
    environment: production
spec:
  # Service uses the below labels to select the pods
  selector:
  
    name: redis
    project: roboshop
    tier: database
    environment: production
  ports:
    - protocol: TCP
      port: 6379 # service port
      targetPort: 6379 # container port      
        
