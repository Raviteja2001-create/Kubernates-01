apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    name: mongodb
    project: roboshop
    tier: database
    environment: production
spec:
  replicas: 1
  selector: 
   matchLabels:  
     name: mongodb
     project: roboshop
     tier: database
     environment: production
  template:
   metadata:
     labels:
       name: mongodb
       project: roboshop
       tier: database
       environment: production
   spec:
     containers:
      - name: mongodb
        image: joindevops/mongodb:4.0.0
        ports:
         - containerPort: 27017


---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  # servicer labels
  labels:
    name: mongodb
    project: roboshop
    tier: database
    environment: production
spec:
  # Service uses the below labels to select the pods
  selector:
  
    name: mongodb
    project: roboshop
    tier: database
    environment: production
  ports:
    - protocol: TCP
      port: 27017 # service port
      targetPort: 27017 # container port         

       