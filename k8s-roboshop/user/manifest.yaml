apiVersion: v1
kind: ConfigMap
metadata:
  name: user-config
  namespace: roboshop  
data:
   MONGO: "true"
   MONGO_URL: "mongodb://mongodb:27017/users"
   REDIS_URL: "redis://redis:6379"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  # labels related to deployment resource
  labels:
    project: roboshop
    tier: backend
    component: user
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: user  
  template:
    metadata:
     labels: 
       project: roboshop
       tier: backend
       component: user  
    spec:
      containers:
       - name: user
         image: joindevops/user:4.0.0
         envFrom:
         - configMapRef:
             name: user-config
           
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: roboshop
  # servicer labels
  labels:
    project: roboshop
    tier: backend
    component: user
spec:
  # Service uses the below labels to select the pods
  selector:
    project: roboshop
    tier: backend
    component: user
  ports:
    - protocol: TCP
      port: 8080 # service port
      targetPort: 8080 # container port 